name: Build Rootful DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: brew install ldid xz dpkg

      - name: Install Theos and iOS SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone theos/theos "$HOME/theos" -- --recursive --depth 1
          mkdir -p "$HOME/theos/sdks"
          gh repo clone theos/sdks "$HOME/sdks-temp" -- --depth 1
          cp -R "$HOME/sdks-temp/"*.sdk "$HOME/theos/sdks/"
          rm -rf "$HOME/sdks-temp"

      - name: Build DEB Package
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FacebookLegacyFix-deb
          path: packages/*.deb
