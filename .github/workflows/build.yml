name: Build Rootful DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: brew install ldid xz dpkg

      - name: Install Theos and iOS SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone theos/theos "$HOME/theos" -- --recursive
          mkdir -p "$HOME/theos/sdks"
          SDK_HOST="github.com"
          curl -L "https://${SDK_HOST}/theos/sdks/archive/refs/heads/master.zip" -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk "$HOME/theos/sdks/"
          rm -rf sdks.zip sdks-master

      - name: Build DEB Package
        env:
          THEOS: ${{ runner.home }}/theos
        run: |
          make clean package FINALPACKAGE=1

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FacebookLegacyFix-deb
          path: packages/*.deb
